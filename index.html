/* ==== app.js ==== */
/* CivicPulse — application shell: store (with localStorage persistence), router,
   top bar, role switcher, settings drawer, demo tips and boot. */
(function (root) {
  'use strict';
  var CP = root.CP, UI = CP.UI, esc = CP.esc, P = CP.pages;
  var KEY = 'civicpulse:v1';

  CP.settings = { theme: 'light', reducedMotion: false, llmEnabled: false, llmKey: '' };
  CP.reducedMotion = false;
  CP.role = 'citizen';

  /* ================= optional live-LLM hook (OFF by default, 4 s timeout) ================= */
  CP.llm = {
    classifyWithLLM: function (text, opts) {
      opts = opts || {};
      if (!CP.settings.llmEnabled || !CP.settings.llmKey) return Promise.resolve(CP.classify('', text));
      var fallback = function () { return CP.classify('', text); };
      var timeout = new Promise(function (res) { setTimeout(function () { res(fallback()); }, opts.timeoutMs || 4000); });
      var call = fetch(opts.endpoint || 'https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + CP.settings.llmKey },
        body: JSON.stringify({
          model: 'gpt-4o-mini', temperature: 0, max_tokens: 40,
          messages: [{ role: 'system', content: 'Reply with only the single best category from: ' + CP.CATEGORIES.join(', ') + '.' }, { role: 'user', content: String(text).slice(0, 1200) }]
        })
      }).then(function (r) { return r.json(); }).then(function (j) {
        var out = ((j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '').trim();
        var hit = CP.CATEGORIES.filter(function (c) { return out.toLowerCase().indexOf(c.toLowerCase()) !== -1; })[0];
        if (!hit) return fallback();
        var base = CP.classify('', text);
        return { category: hit, confidence: Math.max(base.confidence, 0.6), secondary: base.category, matchedKeywords: base.matchedKeywords };
      }).catch(fallback);
      return Promise.race([call, timeout]);
    }
  };

  /* ================= store ================= */
  function makeStore() {
    var store = {
      reports: [], clusters: [], clusterMeta: {}, upvoted: {}, seq: 1001, clusterSeq: 201,
      clusterById: function (id) { return this.clusters.filter(function (c) { return c.id === id; })[0]; },
      reportById: function (id) { return this.reports.filter(function (r) { return r.id === id; })[0]; },

      saveMeta: function () {
        var m = {};
        this.clusters.forEach(function (c) {
          m[c.id] = { status: c.status, statusHistory: c.statusHistory, assignedTo: c.assignedTo, assignedDepartment: c.assignedDepartment, internalNotes: c.internalNotes };
        });
        this.clusterMeta = m;
      },
      persist: function () {
        this.saveMeta();
        try {
          localStorage.setItem(KEY, JSON.stringify({
            v: 1, reports: this.reports, meta: this.clusterMeta, upvoted: this.upvoted,
            seq: this.seq, clusterSeq: this.clusterSeq,
            settings: CP.settings, role: CP.role
          }));
        } catch (e) { /* storage may be unavailable (private mode) — the app still works in memory */ }
      },

      applyMeta: function () {
        var self = this;
        this.clusters.forEach(function (c) {
          var m = self.clusterMeta[c.id];
          if (!m) return;
          c.status = m.status || c.status;
          if (m.statusHistory) c.statusHistory = m.statusHistory;
          if (m.assignedTo !== undefined) c.assignedTo = m.assignedTo;
          if (m.assignedDepartment) c.assignedDepartment = m.assignedDepartment;
          if (m.internalNotes) c.internalNotes = m.internalNotes;
          var byId = {}; self.reports.forEach(function (r) { byId[r.id] = r; });
          CP.finalizeCluster(c, byId, Date.now());
          if (m.assignedDepartment) c.assignedDepartment = m.assignedDepartment;

      recomputeAll: function () {

        var built = CP.buildClusters(this.reports, now);

        var used = {};
        built.forEach(function (cl) {
          var found = null;
          for (var i = 0; i < cl.reportIds.length; i++) {
            var cand = prev[cl.reportIds[i]];
            if (cand && !used[cand]) { found = cand; break; }
          }

      addReport: function (input) {

        var corpus = CP.buildCorpus(this.reports.map(function (r) { return CP.tokenize(r.title + ' ' + r.description); }));
        var report = {
          id: 'R-' + (this.seq++),
          title: input.title,
          description: input.description,

          categoryConfidence: input.categoryOverride ? 1 : cls.confidence,
          secondaryCategory: cls.secondary,
          matchedKeywords: cls.matchedKeywords,
          lat: input.lat, lng: input.lng,
          address: input.address || '', street: input.street || '', neighborhood: input.neighborhood || '',
          photoDataUrl: input.photoDataUrl,
          reporterName: 'You',
          createdAt: new Date(now).toISOString(),
          upvotes: 0,
          urgencyFlags: CP.detectUrgency(input.title + ' ' + input.description),
          nearSensitiveSite: input.nearSensitiveSite || undefined,
          clusterId: '', isMine: true

        var byId = {}; this.reports.forEach(function (r) { byId[r.id] = r; });
        var g = CP.groupReport(report, this.clusters, byId, corpus);
        var cl;
        if (g.isNew) {
          cl = {
            id: 'C-' + (this.clusterSeq++), title: '', category: report.category, reportIds: [],
            centroid: { lat: report.lat, lng: report.lng }, radiusMeters: 25, neighborhood: report.neighborhood,
            firstReportedAt: report.createdAt, lastReportedAt: report.createdAt, status: 'Submitted',
            statusHistory: [{ status: 'Submitted', at: report.createdAt, note: 'Report received and clustered.' }],
            assignedDepartment: CP.departmentFor(report.category), assignedTo: undefined, internalNotes: [],
            priorityScore: 0, priorityLevel: 'Low', priorityBreakdown: [], summary: '', estimatedResolution: '', escalationRisk: 0
          };
          this.clusters.push(cl);

        }
        cl.reportIds.push(report.id);
        report.clusterId = cl.id;
        this.reports.push(report);

      upvote: function (reportId) {

        if (!r) return false;
        r.upvotes++;

        var cl = this.clusterById(r.clusterId);
        if (cl) {
          var byId = {}; this.reports.forEach(function (x) { byId[x.id] = x; });
          CP.finalizeCluster(cl, byId, Date.now());
        }
        this.persist();
        return true;
      },

      setClusterStatus: function (id, status, note) {
        var c = this.clusterById(id);
        if (!c) return;
        c.status = status;
        c.statusHistory.push({ status: status, at: new Date().toISOString(), note: note });
        var byId = {}; this.reports.forEach(function (x) { byId[x.id] = x; });
        CP.finalizeCluster(c, byId, Date.now());
        this.persist();
      },
      assignCluster: function (id, dept, officer) {
        var c = this.clusterById(id);
        if (!c) return;
        if (dept) c.assignedDepartment = dept;
        c.assignedTo = officer;
        if (c.status === 'Submitted' || c.status === 'Under Review') {
          c.status = 'Assigned';
          c.statusHistory.push({ status: 'Assigned', at: new Date().toISOString(), note: 'Assigned to ' + (officer || 'a field team') + ' · ' + c.assignedDepartment + '.' });
        }
        var byId = {}; this.reports.forEach(function (x) { byId[x.id] = x; });
        CP.finalizeCluster(c, byId, Date.now());
        this.persist();
      },
      addNote: function (id, author, text) {

    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { saved = null; }

      store.clusterMeta = saved.meta || {};

    { re: /^\/community$/, page: 'community', title: 'Community · CivicPulse' },
    { re: /^\/authority$/, page: 'dashboard', title: 'Authority Dashboard · CivicPulse' },
    { re: /^\/authority\/issues\/(.+)$/, page: 'clusterDetail', title: 'Cluster · CivicPulse' },
    { re: /^\/authority\/analytics$/, page: 'analytics', title: 'Analytics · CivicPulse' },
    { re: /^\/about$/, page: 'about', title: 'About · CivicPulse' }
  ];
  var seenPages = {};

  function parseHash() {
    var h = location.hash.replace(/^#/, '') || '/';
    if (h.charAt(0) !== '/') h = '/' + h;
    return h;
  }

  function navItems() {
    if (CP.role === 'authority') {
      return [['#/', 'Home', 'pulse'], ['#/authority', 'Dashboard', 'building'], ['#/authority/analytics', 'Analytics', 'trend'], ['#/community', 'Community', 'users'], ['#/about', 'About', 'info']];
    }
    return [['#/', 'Home', 'pulse'], ['#/report', 'Report', 'plus'], ['#/my-reports', 'My Reports', 'note'], ['#/community', 'Community', 'users'], ['#/about', 'About', 'info']];
  }

  function renderTopBar() {
    var bar = document.getElementById('topbar');
    if (!bar) return;
    var cur = parseHash();
    var items = navItems();
    bar.innerHTML = '<div class="wrap topbar-in">' +
      '<a class="logo" href="#/">' + '<span class="logo-mark">' + UI.icon('pulse', 17) + '</span>CivicPulse</a>' +
      '<nav class="nav" aria-label="Main">' + items.map(function (it) {
        var active = (it[0] === '#/' && cur === '/') || (it[0] !== '#/' && cur.indexOf(it[0].slice(1)) === 0);
        return '<a href="' + it[0] + '" class="' + (active ? 'active' : '') + '">' + it[1] + '</a>';
      }).join('') + '</nav>' +
      '<span class="grow"></span>' +
      '<div class="seg" role="group" aria-label="Switch role">' +
      '<button class="' + (CP.role === 'citizen' ? 'on' : '') + '" data-role="citizen">Citizen</button>' +
      '<button class="' + (CP.role === 'authority' ? 'on' : '') + '" data-role="authority">Authority</button></div>' +
      '<button class="btn primary pulse" data-demo-start title="Play the 105-second guided demo">' + UI.icon('play', 15) + '<span class="hide-sm">Start Demo</span></button>' +
      '<button class="icon-btn" data-theme-toggle aria-label="Toggle dark mode">' + UI.icon(CP.settings.theme === 'dark' ? 'sun' : 'moon', 16) + '</button>' +
      '<button class="icon-btn" data-settings aria-label="Open settings">' + UI.icon('gear', 16) + '</button>' +
      '</div>';

    bar.querySelectorAll('[data-role]').forEach(function (b) {
      b.addEventListener('click', function () { app.setRole(b.getAttribute('data-role'), true); });
    });
    bar.querySelector('[data-demo-start]').addEventListener('click', function () { CP.Demo.start(); });
    bar.querySelector('[data-theme-toggle]').addEventListener('click', function () {
      CP.settings.theme = CP.settings.theme === 'dark' ? 'light' : 'dark';
      applySettings(); ctx.store.persist(); renderTopBar();
    });
    bar.querySelector('[data-settings]').addEventListener('click', openSettings);
  }

  function renderTabBar() {
    var tb = document.getElementById('tabbar');
    if (!tb) return;
    var cur = parseHash();
    tb.innerHTML = navItems().slice(0, 5).map(function (it) {
      var active = (it[0] === '#/' && cur === '/') || (it[0] !== '#/' && cur.indexOf(it[0].slice(1)) === 0);
      return '<a href="' + it[0] + '" class="' + (active ? 'active' : '') + '">' + UI.icon(it[2], 19) + '<div>' + it[1] + '</div></a>';
    }).join('');
  }

  app.setRole = function (role, announce) {
    CP.role = role;
    ctx.store.persist();
    renderTopBar(); renderTabBar();
    if (announce) {
      UI.toast(role === 'authority' ? 'Authority view — ranked action queue.' : 'Citizen view — report and track issues.', 'ok', 2400);
      var dest = role === 'authority' ? '#/authority' : '#/report';
      if (parseHash() === '/' || parseHash() === '/report' || parseHash() === '/authority') location.hash = dest;
    }
    app.route();
  };
  app.navigate = function (hash) { location.hash = hash; };

  function route() {
    var path = parseHash();
    var match = null, params = null;
    for (var i = 0; i < ROUTES.length; i++) {
      var m = path.match(ROUTES[i].re);
      if (m) { match = ROUTES[i]; params = m[1]; break; }
    }
    /* invalid cluster id → 404 */
    if (match && match.page === 'clusterDetail' && !ctx.store.clusterById(params)) {
      match = { page: 'notFound', title: 'Not found · CivicPulse' };
    }
    if (!match) match = { page: 'notFound', title: 'Not found · CivicPulse' };
    document.title = match.title;

    /* tear down old maps */
    (CP._maps || []).forEach(function (m) { try { if (m.map) m.map.remove(); } catch (e) { } });
    CP._maps = [];
    ctx.wizard = null;

    var mount = document.getElementById('pageMount');
    mount.innerHTML = '';

    function paintPage() {
      var fn = P[match.page];
      var localCtx = Object.assign({}, ctx, { mount: mount });
      try {
        fn(localCtx, params);
      } catch (e) {
        mount.innerHTML = '<div class="page"><div class="wrap">' + UI.emptyState('Something went wrong on this page', String(e && e.message || e) + ' — use the nav to continue; the rest of the app is unaffected.', 'Back to landing', 'home') + '</div></div>';
        var b = mount.querySelector('[data-action="home"]');
        if (b) b.addEventListener('click', function () { location.hash = '#/'; });
      }
      /* keep ctx mutations (wizard, filters) */
      ['wizard', 'dashFilter', 'commFilter', 'analyticsFilter', 'myFilter', 'dashLayer', 'newReportId', 'flashCluster', 'bumpCluster'].forEach(function (k) {
        if (localCtx[k] !== undefined) ctx[k] = localCtx[k];
      });
    }

    if (!seenPages[match.page] && !CP.Demo.active) {
      seenPages[match.page] = true;
      mount.innerHTML = '<div class="page"><div class="wrap"><div class="row between mb16"><div class="skel" style="height:22px;width:240px"></div></div>' + UI.skeleton(4) + '</div></div>';
      setTimeout(paintPage, 400);
    } else {
      paintPage();
    }
    renderTopBar(); renderTabBar();
  }
  app.route = route;

  function openSettings() {
    var host = document.getElementById('layers');
    host.innerHTML = '<div class="scrim" data-scrim></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Settings">' +
      '<div class="row between mb16"><h3>Settings</h3><button class="icon-btn" data-x aria-label="Close settings">' + UI.icon('x', 16) + '</button></div>' +
      '<div class="card flat" style="background:var(--surface-2)"><div class="row between"><div><b class="small">Dark mode</b><div class="xsmall muted">Persisted to this browser</div></div>' +
      '<button class="btn sm" data-dark>' + (CP.settings.theme === 'dark' ? 'On' : 'Off') + '</button></div></div>' +
      '<div class="card flat mt16" style="background:var(--surface-2)"><div class="row between"><div><b class="small">Reduce motion</b><div class="xsmall muted">Disables non-essential animation</div></div>' +
      '<button class="btn sm" data-motion>' + (CP.settings.reducedMotion ? 'On' : 'Off') + '</button></div></div>' +
      '<div class="card flat mt16" style="background:var(--surface-2)"><b class="small">Demo data</b><div class="xsmall muted mt8">All data lives in this browser under the <code>civicpulse:</code> prefix. Nothing is sent anywhere.</div>' +
      '<button class="btn danger block mt16" data-reset>' + UI.icon('restart', 15) + 'Reset demo data</button></div>' +
      '<div class="card flat mt16" style="background:var(--surface-2)"><div class="row between"><div><b class="small">Use live LLM (experimental)</b><div class="xsmall muted">Off by default · 4 s timeout, silent fallback</div></div>' +
      '<button class="btn sm" data-llm>' + (CP.settings.llmEnabled ? 'On' : 'Off') + '</button></div>' +
      '<input class="input mt16" type="password" placeholder="API key (optional)" value="' + esc(CP.settings.llmKey) + '" data-key />' +
      '<p class="xsmall muted mt8" style="margin-bottom:0">Privacy: the key is stored only in this browser\'s localStorage and is sent directly from your browser to the provider. The demo never depends on it — the deterministic classifier always runs first and is used if this fails or times out.</p></div>' +
      '<div class="card flat mt16" style="background:var(--surface-2)"><b class="small">Demo tips</b><ol class="small muted" style="padding-left:18px;margin:8px 0 0">' +
      '<li>Submit the prepared Lakeview pothole to watch it join a cluster live.</li><li>Upvote a report in Community and watch the priority re-sort.</li><li>Open the top cluster and mark it resolved — the KPIs update.</li></ol>' +
      '<button class="btn block mt16" data-autofill>Load the prepared demo report</button></div>' +
      '<button class="btn primary block mt16" data-close-settings>Done</button>' +
      '</aside>';

    function close() { host.innerHTML = ''; document.removeEventListener('keydown', onKey); }
    function onKey(e) { if (e.key === 'Escape') close(); }
    document.addEventListener('keydown', onKey);
    host.querySelector('[data-scrim]').addEventListener('click', close);
    host.querySelector('[data-x]').addEventListener('click', close);
    host.querySelector('[data-close-settings]').addEventListener('click', close);
    host.querySelector('[data-dark]').addEventListener('click', function () {
      CP.settings.theme = CP.settings.theme === 'dark' ? 'light' : 'dark'; applySettings(); ctx.store.persist(); openSettings(); renderTopBar();
    });
    host.querySelector('[data-motion]').addEventListener('click', function () {
      CP.settings.reducedMotion = !CP.settings.reducedMotion; applySettings(); ctx.store.persist(); openSettings();
      UI.toast('Reduced motion ' + (CP.settings.reducedMotion ? 'enabled' : 'disabled') + '.');
    });
    host.querySelector('[data-llm]').addEventListener('click', function () {
      CP.settings.llmEnabled = !CP.settings.llmEnabled; ctx.store.persist(); openSettings();
      UI.toast(CP.settings.llmEnabled ? 'Live LLM enabled — falls back silently on failure.' : 'Live LLM disabled — deterministic classifier only.');
    });
    host.querySelector('[data-key]').addEventListener('input', function () { CP.settings.llmKey = this.value; ctx.store.persist(); });
    host.querySelector('[data-reset]').addEventListener('click', function () {
      close();
      CP.resetWithConfirm(ctx);
    });
    host.querySelector('[data-autofill]').addEventListener('click', function () {
      close();
      var p = CP.buildDemoPayload(ctx.store.clusters);
      location.hash = '#/report';
      setTimeout(function () {
        if (CP.wizardApi) { CP.wizardApi.fillFrom(p); CP.wizardApi.goStep(2); UI.toast('Prepared demo report loaded — review and submit.', 'ok'); }
      }, 60);
    });
  }

  CP.resetWithConfirm = function (context) {
    UI.confirm('Reset demo data?', 'Every report, cluster, note and status change made in this browser will be discarded and the 44 seeded reports will be restored. This cannot be undone.', 'Reset data', function () {
      try { localStorage.removeItem(KEY); } catch (e) { }
      var seed = CP.buildSeed(Date.now());
      context.store.reports = seed.reports;
      context.store.clusters = seed.clusters;
      context.store.clusterMeta = {};
      context.store.upvoted = {};
      context.store.seq = 1045;
      context.store.clusterSeq = 210;
      context.newReportId = null;
      context.store.persist();
      location.hash = '#/authority';
      app.route();
      UI.toast('Demo data reset to the 44 seeded reports.', 'ok');
    });
  };

  /* ================= boot ================= */
  app.boot = function () {
    CP.appCtx = ctx;
    ctx.store = makeStore();
    ctx.mount = document.getElementById('pageMount');
    applySettings();
    renderTopBar();
    renderTabBar();
    window.addEventListener('hashchange', route);
    window.addEventListener('resize', function () {
      (CP._maps || []).forEach(function (m) { try { if (m.map) m.map.invalidateSize(); } catch (e) { } });
    });
    document.addEventListener('click', function (e) {
      var f = e.target.closest('[data-howai-link]');
      if (f) { e.preventDefault(); CP.showHowAI(); }
    });
    route();
    if (CP.Demo) CP.Demo.init();
  };

  /* boot: the bundle is injected at the end of <body>, but guard for both orders */
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', app.boot);
  else app.boot();
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
