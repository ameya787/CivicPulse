<title>CivicPulse — Many voices. One clear priority.</title>
<meta name="description" content="CivicPulse turns thousands of duplicate civic complaints into a short, explainable, ranked action list. Real in-browser logic, clearly labelled simulation." />
<meta name="color-scheme" content="light dark" />

     built-in schematic map (neutral grid, working pins) renders instead. No API key. -->

<style>/* CivicPulse design system — modern civic-tech, light + dark, 8-pt spacing grid. */
:root {
  --primary: #4F46E5; --primary-soft: #EEF2FF; --accent: #14B8A6;
  --bg: #F8FAFC; --surface: #FFFFFF; --surface-2: #F1F5F9;
  --text: #0F172A; --muted: #64748B; --border: #E2E8F0; --border-strong: #CBD5E1;
  --critical: #DC2626; --high: #F97316; --medium: #EAB308; --low: #22C55E;
  --shadow: 0 1px 2px rgba(15,23,42,.06), 0 8px 24px -12px rgba(15,23,42,.18);
  --shadow-lg: 0 24px 60px -24px rgba(15,23,42,.35);
  --r: 16px; --r-sm: 10px; --r-lg: 22px;
  --sp: 8px;
  --f: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
html[data-theme="dark"] {
  --bg: #0B1020; --surface: #121A33; --surface-2: #1B2544;
  --text: #E2E8F0; --muted: #94A3B8; --border: #24304F; --border-strong: #33415C;
  --primary-soft: #1E2547;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  --shadow-lg: 0 30px 70px -30px rgba(0,0,0,.8);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
/* hard guarantee: nothing may ever force a horizontal scrollbar (360 px target) */
html { overflow-x: hidden; max-width: 100%; }
img, svg, table, pre, code { max-width: 100%; }
body {
  font-family: var(--f); background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.55;
  overflow-x: hidden;
}
h1,h2,h3,h4 { margin: 0; letter-spacing: -.02em; font-weight: 650; line-height: 1.2; }
h1 { font-size: clamp(30px, 5vw, 54px); }
h2 { font-size: clamp(21px, 2.6vw, 28px); }
h3 { font-size: 18px; }
h4 { font-size: 15px; }
p { margin: 0 0 8px; }
a { color: var(--primary); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
.num, .tabular { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.xsmall { font-size: 11.5px; }
.center { text-align: center; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.col { display: flex; flex-direction: column; }
.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}.gap24{gap:24px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}
.truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hide { display: none !important; }

/* ---------- layout ---------- */
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 24px; }
.page { padding: 24px 0 96px; animation: pageIn .2s ease both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0,1fr)); }
.split-40 { display: grid; grid-template-columns: 40% 1fr; gap: 16px; align-items: start; }
.split-3 { display: grid; grid-template-columns: 1.05fr 1.35fr .95fr; gap: 16px; align-items: start; }
.split-2 { display: grid; grid-template-columns: 1fr 1.1fr; gap: 16px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* ---------- cards ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
  box-shadow: var(--shadow); padding: 16px;
}
.card.pad20 { padding: 20px; }
.card.flat { box-shadow: none; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.card-title { font-weight: 650; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.hoverable { transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
.hoverable:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--border-strong); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 9px 14px; border-radius: var(--r-sm); font-weight: 550; font-size: 14px;
  cursor: pointer; transition: all .15s ease; white-space: nowrap;
}
.btn:hover { border-color: var(--border-strong); background: var(--surface-2); }
.btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.teal { background: var(--accent); border-color: var(--accent); color: #05302c; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 35%, transparent); }
.btn.sm { padding: 6px 10px; font-size: 12.5px; border-radius: 8px; }
.btn.lg { padding: 13px 22px; font-size: 15.5px; border-radius: 12px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.pulse { box-shadow: 0 0 0 0 color-mix(in srgb, var(--primary) 60%, transparent); animation: glow 2.6s infinite; }
@keyframes glow { 0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--primary) 55%,transparent)} 70%{box-shadow:0 0 0 12px transparent} 100%{box-shadow:0 0 0 0 transparent} }

/* ---------- chips / pills / badges ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface-2); font-size: 12.5px; font-weight: 550;
}
.chip.btn-like { cursor: pointer; }
.chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 650; letter-spacing: .01em; }
.pill.Critical { background: color-mix(in srgb, var(--critical) 14%, transparent); color: var(--critical); }
.pill.High { background: color-mix(in srgb, var(--high) 16%, transparent); color: color-mix(in srgb, var(--high) 88%, #000); }
.pill.Medium { background: color-mix(in srgb, var(--medium) 20%, transparent); color: color-mix(in srgb, var(--medium) 80%, #000); }
.pill.Low { background: color-mix(in srgb, var(--low) 16%, transparent); color: color-mix(in srgb, var(--low) 72%, #000); }
html[data-theme="dark"] .pill.High, html[data-theme="dark"] .pill.Medium, html[data-theme="dark"] .pill.Low { color: inherit; }
.status { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--border); }
.status.Submitted { color: #0369A1; } .status\2e Submitted { color: #0369A1; }
.ai-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 650; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); cursor: help; }
.ai-badge .dot { width: 6px; height: 6px; border-radius: 50%; }
.ai-badge.live .dot { background: #22C55E; box-shadow: 0 0 0 3px color-mix(in srgb, #22C55E 22%, transparent); }
.ai-badge.sim .dot { background: #F59E0B; box-shadow: 0 0 0 3px color-mix(in srgb, #F59E0B 22%, transparent); }
.kw { background: color-mix(in srgb, var(--primary) 15%, transparent); color: var(--primary); border-radius: 5px; padding: 0 4px; font-weight: 600; }
.urgency { background: color-mix(in srgb, var(--critical) 13%, transparent); color: var(--critical); border: 1px solid color-mix(in srgb, var(--critical) 25%, transparent); border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 650; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 60; backdrop-filter: blur(14px);
  background: color-mix(in srgb, var(--surface) 78%, transparent);
  border-bottom: 1px solid var(--border);
}
.topbar-in { display: flex; align-items: center; gap: 16px; height: 62px; }
.logo { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; letter-spacing: -.02em; }
.logo-mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--primary), var(--accent)); display: grid; place-items: center; color: #fff; box-shadow: var(--shadow); }
.nav { display: flex; gap: 2px; }
.nav a { padding: 7px 12px; border-radius: 9px; color: var(--muted); font-weight: 550; font-size: 14px; }
.nav a:hover { background: var(--surface-2); color: var(--text); }
.nav a.active { background: var(--primary-soft); color: var(--primary); }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-weight: 600; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); }
.tabbar { display: none; }
@media (max-width: 1140px) { .hide-sm { display: none; } }
@media (max-width: 900px) {
  .nav { display: none; }
  .topbar-in { gap: 8px; }
  .wrap { padding: 0 16px; }
  .tabbar {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 70;
    background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px);
    border-top: 1px solid var(--border); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar a { flex: 1; text-align: center; padding: 6px 2px; border-radius: 10px; color: var(--muted); font-size: 10.5px; font-weight: 600; }
  .tabbar a.active { color: var(--primary); background: var(--primary-soft); }
  .page { padding-bottom: 84px; }
  .g4, .g5, .g3 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .split-40, .split-3, .split-2 { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .g2, .g3, .g4, .g5 { grid-template-columns: 1fr; }
  h1 { font-size: 30px; }
  .topbar-in { gap: 6px; }
  .logo { font-size: 0; gap: 0; }
  .logo-mark { width: 32px; height: 32px; }
  .seg { padding: 2px; }
  .seg button { padding: 6px 7px; font-size: 11.5px; }
  .icon-btn { width: 32px; height: 32px; }
  .wrap { padding: 0 12px; }
  .card.pad20, .card { padding: 14px; }
  .modal-body, .modal-head, .modal-foot { padding-left: 14px; padding-right: 14px; }
  .demo { padding: 10px 12px; }
  .hero { padding: 28px 0 20px; }
  .stat .v { font-size: 25px; }
}

/* ---------- inputs ---------- */
label.f { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
.input, textarea.input, select.input {
  width: 100%; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--border);
  background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s;
}
.input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
textarea.input { min-height: 120px; resize: vertical; }
.err { color: var(--critical); font-size: 12px; margin-top: 5px; }
.input.bad { border-color: var(--critical); }

/* ---------- stats ---------- */
.stat { display: flex; flex-direction: column; gap: 4px; }
.stat .k { font-size: 11.5px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.stat .v { font-size: 30px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat .sub { font-size: 12px; color: var(--muted); }

/* ---------- priority ring ---------- */
.ring { position: relative; display: grid; place-items: center; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring .rv { position: absolute; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- progress / bars ---------- */
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.contrib { display: flex; height: 14px; border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
.contrib > span { height: 100%; }
table.factors { width: 100%; border-collapse: collapse; font-size: 13px; }
table.factors th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--border); }
table.factors td { padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.factors tr:last-child td { border-bottom: 0; }

/* ---------- queue cards ---------- */
.qcard { position: relative; cursor: pointer; }
.qcard .rank { position: absolute; top: -1px; left: -1px; width: 30px; height: 30px; border-radius: var(--r) 0 12px 0; background: var(--surface-2); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--muted); }
.qcard.flash { animation: flash 1.6s ease; }
@keyframes flash { 0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--primary) 70%,transparent)} 25%{box-shadow:0 0 0 6px color-mix(in srgb,var(--primary) 35%,transparent)} 100%{box-shadow:var(--shadow)} }
.bump { animation: bump .5s ease; }
@keyframes bump { 0%{transform:scale(1)} 40%{transform:scale(1.35)} 100%{transform:scale(1)} }
.qactions { display: flex; gap: 6px; opacity: 0; transition: opacity .15s; }
.qcard:hover .qactions, .qcard:focus-within .qactions { opacity: 1; }

/* ---------- map ---------- */
.mapwrap { position: relative; border-radius: var(--r); overflow: hidden; border: 1px solid var(--border); background: var(--surface-2); }
.map-fallback { position: absolute; inset: 0; background:
  linear-gradient(var(--border) 1px, transparent 1px) 0 0/40px 40px,
  linear-gradient(90deg, var(--border) 1px, transparent 1px) 0 0/40px 40px,
  radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--primary) 7%, transparent), transparent 60%),
  var(--surface-2);
  opacity: .9; }
.leaflet-container { background: var(--surface-2); font-family: var(--f); }
.pin { border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 11px; box-shadow: 0 2px 8px rgba(0,0,0,.35); border: 2px solid rgba(255,255,255,.9); }
.pin.pulse::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid currentColor; animation: pulsering 1.8s infinite; }
@keyframes pulsering { 0%{transform:scale(.8);opacity:.9} 100%{transform:scale(1.7);opacity:0} }
.legend { position: absolute; bottom: 10px; left: 10px; z-index: 500; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font-size: 11.5px; backdrop-filter: blur(8px); }
.maptools { position: absolute; top: 10px; right: 10px; z-index: 500; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.leaflet-popup-content-wrapper { border-radius: 12px; }

/* ---------- wizard ---------- */
.steps { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
.steps .s { flex: 1; display: flex; align-items: center; gap: 9px; }
.steps .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); flex: none; }
.steps .s.on .n { background: var(--primary); border-color: var(--primary); color: #fff; }
.steps .s.done .n { background: var(--accent); border-color: var(--accent); color: #05302c; }
.steps .l { height: 2px; flex: 1; background: var(--border); border-radius: 2px; }
.steps .l.on { background: var(--accent); }
.dropzone { border: 2px dashed var(--border-strong); border-radius: var(--r); padding: 20px; text-align: center; cursor: pointer; transition: all .15s; }
.dropzone.over { border-color: var(--primary); background: var(--primary-soft); }

/* ---------- modal / drawer / overlay ---------- */
.scrim { position: fixed; inset: 0; background: rgba(15,23,42,.55); backdrop-filter: blur(3px); z-index: 100; display: grid; place-items: center; padding: 20px; animation: fade .18s ease; }
@keyframes fade { from{opacity:0} to{opacity:1} }
.modal { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--border); width: 100%; max-width: 720px; max-height: 88vh; overflow: auto; animation: pop .22s cubic-bezier(.2,.9,.3,1.2); }
.modal.narrow { max-width: 480px; }
.modal.wide { max-width: 940px; }
@keyframes pop { from{opacity:0;transform:translateY(12px) scale(.98)} to{opacity:1;transform:none} }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 2; }
.modal-body { padding: 20px; }
.modal-foot { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; position: sticky; bottom: 0; background: var(--surface); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 92vw); background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow-lg); z-index: 110; padding: 20px; overflow: auto; animation: slideIn .22s ease; }
@keyframes slideIn { from{transform:translateX(24px);opacity:.6} to{transform:none;opacity:1} }

/* ---------- toasts ---------- */
.toasts { position: fixed; bottom: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.toast { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--primary); border-radius: var(--r-sm); box-shadow: var(--shadow-lg); padding: 11px 14px; font-size: 13.5px; max-width: 380px; animation: slideIn .2s ease; display: flex; gap: 9px; align-items: flex-start; }
.toast.ok { border-left-color: var(--low); } .toast.warn { border-left-color: var(--high); } .toast.err { border-left-color: var(--critical); }
@media (max-width: 900px) { .toasts { bottom: 76px; left: 16px; right: 16px; align-items: stretch; } }

/* ---------- analysis steps ---------- */
.astep { display: flex; gap: 11px; align-items: flex-start; padding: 9px 0; opacity: .38; transition: opacity .3s; }
.astep.on { opacity: 1; }
.astep.done { opacity: .82; }
.astep .ic { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border-strong); display: grid; place-items: center; flex: none; font-size: 11px; font-weight: 700; }
.astep.on .ic { border-color: var(--primary); }
.astep.done .ic { background: var(--accent); border-color: var(--accent); color: #05302c; }
.spin { width: 12px; height: 12px; border: 2px solid color-mix(in srgb, var(--primary) 30%, transparent); border-top-color: var(--primary); border-radius: 50%; animation: sp .7s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

/* ---------- checkmark ---------- */
.check { width: 68px; height: 68px; border-radius: 50%; background: color-mix(in srgb, var(--low) 16%, transparent); display: grid; place-items: center; margin: 0 auto; }
.check svg { animation: draw .5s ease .1s both; }
.check circle { animation: draw .5s ease both; }
@keyframes draw { from { stroke-dashoffset: 200; } to { stroke-dashoffset: 0; } }

/* ---------- hero ---------- */
.hero { position: relative; overflow: hidden; padding: 56px 0 40px; }
.blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .5; pointer-events: none; }
.blob.a { width: 420px; height: 420px; background: color-mix(in srgb, var(--primary) 45%, transparent); top: -140px; left: -80px; animation: float 18s ease-in-out infinite; }
.blob.b { width: 360px; height: 360px; background: color-mix(in srgb, var(--accent) 42%, transparent); top: -60px; right: -60px; animation: float 22s ease-in-out infinite reverse; }
@keyframes float { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,26px)} }
.hero-dots { position: absolute; inset: 0; pointer-events: none; opacity: .55; }
.hero-dots i { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--primary); opacity: .5; animation: drift 12s linear infinite; }
@keyframes drift { 0%{transform:translate(0,0);opacity:0} 20%{opacity:.6} 100%{transform:translate(40px,-90px);opacity:0} }

/* ---------- charts ---------- */
.chart { width: 100%; height: auto; overflow: visible; }
.chart .grid-line { stroke: var(--border); stroke-width: 1; }
.chart text { fill: var(--muted); font-size: 10.5px; }
.chart .axis { fill: var(--muted); font-size: 10px; }

/* ---------- table ---------- */
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--border); }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--border); }
.tbl tbody tr:hover { background: var(--surface-2); }

/* ---------- timeline ---------- */
.tl { position: relative; padding-left: 20px; }
.tl::before { content: ''; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
.tl .it { position: relative; padding: 0 0 14px; }
.tl .it::before { content: ''; position: absolute; left: -19px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border-strong); }
.tl .it.done::before { background: var(--accent); border-color: var(--accent); }
.tl .it.now::before { background: var(--primary); border-color: var(--primary); }

/* ---------- demo overlay ---------- */
.demo { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 300; width: min(760px, calc(100vw - 32px)); background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(14px); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); padding: 14px 16px; }
.demo .dots { display: flex; gap: 5px; }
.demo .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); }
.demo .dots i.on { background: var(--primary); width: 18px; border-radius: 4px; }
.spot { position: fixed; z-index: 290; border-radius: 14px; box-shadow: 0 0 0 9999px rgba(15,23,42,.55), 0 0 0 3px var(--primary); pointer-events: none; transition: all .45s cubic-bezier(.2,.8,.2,1); }
.ghost-cursor { position: fixed; z-index: 310; pointer-events: none; transition: all .6s cubic-bezier(.2,.8,.2,1); }
@media (max-width: 900px) { .demo { bottom: 72px; } }

/* ---------- misc ---------- */
.skel { background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shim 1.2s infinite; border-radius: 8px; }
@keyframes shim { to { background-position: -200% 0; } }
.kbd { border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; font-size: 11px; background: var(--surface-2); font-family: ui-monospace, monospace; }
.tt { position: relative; }
.tt > .tt-body { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 7px 10px; border-radius: 8px; font-size: 11.5px; width: max-content; max-width: 260px; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 50; line-height: 1.4; }
.tt:hover > .tt-body { opacity: 1; }
.pop { position: absolute; z-index: 80; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm); box-shadow: var(--shadow-lg); padding: 10px; width: 250px; }
.reduced * { animation: none !important; transition: none !important; }
@media print {
  .topbar, .tabbar, .demo, .spot, .toasts, .no-print { display: none !important; }
  body { background: #fff; }
  .card { box-shadow: none; break-inside: avoid; }
}

<script>
/* ==== core.js ==== */
/* CivicPulse — core utilities: PRNG, geometry helpers, formatting, design tokens.

(function (root) {
  'use strict';
  var CP = root.CP || (root.CP = {});

  CP.STATUSES = ['Submitted', 'Under Review', 'Assigned', 'In Progress', 'Resolved'];
  CP.PRIORITY_LEVELS = ['Critical', 'High', 'Medium', 'Low'];
  CP.NEIGHBORHOOD_NAMES = ['Lakeview', 'Old Market', 'Greenfield', 'Station Road', 'Riverside', 'Hilltop', 'Sunrise Colony', 'Tech Park'];

  CP.PRIORITY_COLORS = { Critical: '#DC2626', High: '#F97316', Medium: '#EAB308', Low: '#22C55E' };
  CP.CATEGORY_COLORS = {
    'Pothole': '#F97316', 'Garbage': '#65A30D', 'Streetlight': '#EAB308', 'Water Leak': '#0EA5E9',
    'Drainage': '#6366F1', 'Traffic Signal': '#EC4899', 'Road Damage': '#B45309', 'Public Safety': '#DC2626',
    'Noise': '#8B5CF6', 'Other': '#64748B'
  };

/* ==== ai-real.js ==== */
/* CivicPulse — REAL AI (genuinely computed in the browser, deterministic, no network).
   7.1 classifier · 7.2 text similarity · 7.3 geo proximity · 7.4 issue grouping ·
   7.5 priority score · urgency detection · analytics aggregation.

(function (root) {
  'use strict';
  var CP = root.CP || (root.CP = {});

  /* ================= 7.1 CATEGORY CLASSIFIER ================= */
  var CATEGORY_KEYWORDS = {
    'Pothole': [['pothole', 3], ['crater', 3], ['hole in road', 4], ['pit on the road', 4], ['axle', 2], ['tyre burst', 2], ['tire burst', 2], ['deep hole', 2]],
    'Garbage': [['garbage', 3], ['trash', 3], ['waste', 3], ['dump', 2], ['litter', 2], ['overflowing bin', 4], ['stink', 2], ['rubbish', 3], ['landfill', 2]],
    'Streetlight': [['streetlight', 3], ['street light', 4], ['lamp post', 4], ['lamp', 2], ['dark street', 4], ['bulb', 2], ['flickering light', 4], ['no lights', 4]],
    'Water Leak': [['leak', 3], ['leaking', 3], ['burst pipe', 4], ['pipeline', 2], ['water wasting', 4], ['water everywhere', 4], ['main line', 4]],
    'Drainage': [['drain', 3], ['sewer', 3], ['sewage', 3], ['clogged', 3], ['waterlogging', 3], ['manhole', 3], ['overflow', 2], ['flooding', 2]],
    'Traffic Signal': [['signal', 3], ['traffic light', 4], ['red light not working', 4], ['junction', 2], ['zebra crossing', 4]],
    'Road Damage': [['crack', 3], ['broken road', 4], ['damaged road', 4], ['uneven', 2], ['sinking', 2], ['collapsed road', 4], ['footpath broken', 4]],
    'Public Safety': [['exposed wire', 4], ['open manhole', 4], ['unsafe', 3], ['accident', 3], ['fallen tree', 4], ['hazard', 3], ['stray', 2], ['harassment', 2]],
    'Noise': [['noise', 3], ['loud', 3], ['speaker', 2], ['construction at night', 4], ['horn', 2]]
  };

  CP.classify = function (title, description) {
    var text = CP.normText((title || '') + ' ' + (description || ''));
    var scores = {}, matched = {};
    Object.keys(CATEGORY_KEYWORDS).forEach(function (cat) {
      var score = 0, hits = [];

    'as into out up down over under again more most some any all one two we our us i my me you your they their them he she his her ' +
    'people please since after before because near around still now every anyone someone nobody lot get got getting there their ' +
    'when where what which who whom while about across during without within').split(' '));

  var SYNONYMS = {
    trash: 'garbage', waste: 'garbage', rubbish: 'garbage', refuse: 'garbage', litter: 'garbage', dump: 'garbage', bins: 'garbage', bin: 'garbage', stink: 'garbage',
    hole: 'pothole', craters: 'pothole', crater: 'pothole', pits: 'pothole', pit: 'pothole', potholes: 'pothole',
    lamp: 'light', lamps: 'light', streetlight: 'light', streetlights: 'light', lights: 'light', bulb: 'light', bulbs: 'light', dark: 'light',
    leaking: 'leak', burst: 'leak', pipe: 'leak', pipeline: 'leak',
    sewer: 'drain', sewage: 'drain', drainage: 'drain', drains: 'drain', clogged: 'drain', blocked: 'drain', waterlogged: 'drain', waterlogging: 'drain',
    broken: 'damage', damaged: 'damage', cracks: 'damage', cracked: 'damage', caved: 'damage',
    unsafe: 'danger', dangerous: 'danger', hazard: 'danger', danger: 'danger',
    accidents: 'accident',
    flooding: 'flood', flooded: 'flood',
    overflowing: 'overflow', overflowed: 'overflow', spilling: 'spill', spilt: 'spill', gushing: 'spill',

    if (w.slice(-2) === 'ly') return w.slice(0, -2);

  };

    return uni ? inter / uni : 0;

  /* ================= 7.5 URGENCY DETECTION ================= */
  var URGENCY_KEYWORDS = ['urgent', 'emergency', 'dangerous', 'accident', 'injured', 'child', 'children', 'school', 'hospital', 'electric', 'exposed', 'flooding', 'collapsed', 'since weeks'];
  CP.URGENCY_KEYWORDS = URGENCY_KEYWORDS;
  CP.detectUrgency = function (text) {
    var t = CP.normText(text);

  };

  /* ================= 7.3 ISSUE GROUPING ================= */
  var RELATED = [['Pothole', 'Road Damage'], ['Drainage', 'Water Leak'], ['Streetlight', 'Public Safety']];
  CP.relatedCategories = function (a, b) {
    return RELATED.some(function (p) { return (p[0] === a && p[1] === b) || (p[1] === a && p[0] === b); });
  };

  CP.groupReport = function (report, clusters, reportsById, corpus) {
    var rTok = CP.tokenize(report.title + ' ' + report.description);

      else if (d <= 300 && s >= 0.55) { match = true; reason = 'within 300 m and highly similar'; }

  CP.SEVERITY_BASE = SEVERITY_BASE;

    var urgencySet = new Set();
    reports.forEach(function (r) { (r.urgencyFlags || []).forEach(function (f) { urgencySet.add(f); }); });
    var urgencyCount = urgencySet.size;
    var base = SEVERITY_BASE[cluster.category] || 30;
    var severity = Math.min(100, base + 5 * urgencyCount);
    var totalUpvotes = reports.reduce(function (a, r) { return a + (r.upvotes || 0); }, 0);
    var volume = Math.min(100, 18 * (count - 1) + 20) + Math.min(15, totalUpvotes / 4);
    var site = reports.map(function (r) { return r.nearSensitiveSite; }).filter(Boolean)[0];
    var safety = (site === 'School' || site === 'Hospital') ? 100 : site === 'Transit Hub' ? 70 : site === 'Market' ? 55 : 20;
    var resolved = cluster.status === 'Resolved';
    var daysOpen = CP.daysOpen(cluster.firstReportedAt, now);
    var age = resolved ? 0 : Math.min(100, daysOpen * 12);
    var urgency = Math.min(100, 35 * urgencyCount);

      { factor: 'Severity', weight: 0.30, value: severity, note: 'Base severity for ' + cluster.category + ' plus 5 per urgency flag.' },
      { factor: 'Volume / corroboration', weight: 0.20, value: Math.min(100, volume), note: count + ' report' + (count === 1 ? '' : 's') + ' and ' + totalUpvotes + ' upvote' + (totalUpvotes === 1 ? '' : 's') + ' in this cluster.' },
      { factor: 'Safety & sensitive location', weight: 0.20, value: safety, note: site ? ('Located near a ' + site + '.') : 'No school, hospital, market or transit hub nearby.' },
      { factor: 'Age / unresolved', weight: 0.15, value: age, note: resolved ? 'Resolved — no age penalty.' : (Math.floor(daysOpen) + ' day' + (Math.floor(daysOpen) === 1 ? '' : 's') + ' open.') },
      { factor: 'Urgency language', weight: 0.15, value: urgency, note: urgencyCount ? (urgencyCount + ' urgency keyword' + (urgencyCount === 1 ? '' : 's') + ' detected.') : 'No urgency keywords detected.' }
    ];
    factors.forEach(function (f) {
      f.value = Math.round(f.value * 10) / 10;
      f.contribution = Math.round(f.value * f.weight * 10) / 10;
    });
    var score = Math.round(factors.reduce(function (a, f) { return a + f.contribution; }, 0));
    var level;
    if (resolved) level = 'Low';
    else if (score >= 75) level = 'Critical';
    else if (score >= 55) level = 'High';
    else if (score >= 35) level = 'Medium';

  };

  /* ================= build clusters from reports ================= */
  function mostCommon(arr) {

    };

    var dates = rs.map(function (r) { return r.createdAt; }).sort();
    cl.firstReportedAt = dates[0];
    cl.lastReportedAt = dates[dates.length - 1];
    var street = mostCommon(rs.map(function (r) { return r.street; })) || cl.neighborhood;
    cl.title = cl.category + ' issue near ' + street;
    cl.assignedDepartment = CP.departmentFor(cl.category);
    var p = CP.computePriority(cl, rs, now);
    cl.priorityScore = p.priorityScore;
    cl.priorityLevel = p.priorityLevel;

        (c.matchedKeywords.length ? '<div class="small muted mt16 mb8">Matched keywords</div><div class="row wrap gap8" style="gap:5px">' + c.matchedKeywords.map(function (k) { return '<span class="kw">' + esc(k) + '</span>'; }).join('') + '</div>' : '') +
        (flags.length ? '<div class="small muted mt16 mb8">Urgency language detected</div><div class="row wrap gap8" style="gap:5px">' + UI.urgencyChips(flags) + '</div>' : '') +
        (w.photoDataUrl ? '<div class="row gap8 mt16 small">' + UI.aiBadge('sim', 'Simulated vision') + '<span class="muted">Photo labelled "' + esc(c.category) + '" at ' + CP.photoAnalysis({ id: 'R-preview', category: c.category }).confidence + ' confidence (no real vision model).</span></div>' : '') +
        '</div>';
    }

    function step1() {
      return '<div class="split-2"><div class="card pad20">' +
        '<h2 style="font-size:20px">Describe the issue</h2><p class="small muted mb16">Plain words work best. The classifier reads your title and description.</p>' +
        '<label class="f" for="f-title">Title</label>' +
        '<input id="f-title" class="input" placeholder="e.g. Deep pothole near the Lakeview bus stop" value="' + esc(w.title) + '" maxlength="90" />' +
        '<div class="row between mt16"><label class="f" for="f-desc">Description</label><span class="xsmall muted num" id="cc">' + w.description.length + ' / 600</span></div>' +
        '<textarea id="f-desc" class="input" maxlength="600" placeholder="What is wrong, since when, and who is affected?">' + esc(w.description) + '</textarea>' +
        '<div class="row wrap gap8 mt8" data-demo="quickfill"><span class="xsmall muted">Quick fill:</span>' +
        '<button class="chip btn-like" data-fill="pothole">Pothole example</button>' +
        '<button class="chip btn-like" data-fill="garbage">Garbage example</button>' +
        '<button class="chip btn-like" data-fill="leak">Leak example</button></div>' +
        (w.error ? '<div class="err">' + esc(w.error) + '</div>' : '') +
        '<div class="row between mt24"><span></span><button class="btn primary" data-act="next">Continue' + UI.icon('next', 16) + '</button></div>' +
        '</div>' +
        '<div class="stack"><div id="aiSugg" data-demo="sugg">' + suggestionHtml() + '</div>' +
        '<div class="card pad20"><div class="card-head"><div class="card-title">' + UI.icon('camera', 16) + 'Photo (optional)</div></div>' +
        '<div class="dropzone" id="dz">' + (w.photoDataUrl
          ? '<img src="' + w.photoDataUrl + '" alt="Attached photo preview" style="max-height:170px;border-radius:10px;display:block;margin:0 auto 10px" /><button class="btn sm" data-act="rmphoto">' + UI.icon('x', 14) + 'Remove photo</button>'
          : '<div class="muted">' + UI.icon('camera', 26) + '<div class="small mt8">Drag &amp; drop a photo here, or click to choose</div><div class="xsmall muted mt8">Downscaled to 800 px in your browser. Never uploaded.</div></div>') +
        '</div><input type="file" accept="image/*" id="f-photo" class="hide" />' +
        '</div></div></div>';
    }

    function step2() {
      return '<div class="split-2"><div class="card pad20">' +
        '<h2 style="font-size:20px">Where is it?</h2><p class="small muted mb16">Click the map to drop the pin, or use your location.</p>' +
        '<div id="pickMap" data-demo="map" style="height:380px;position:relative"></div>' +
        '<div class="row wrap gap8 mt16">' +
        '<button class="btn" data-act="geo">' + UI.icon('mapPin', 16) + 'Use my location</button>' +
        '<button class="btn ghost" data-act="center">Centre on ' + esc(CP.CITY_NAME) + '</button></div>' +
        '<label class="f mt16" for="f-addr">Address (auto-filled, editable)</label>' +
        '<input id="f-addr" class="input" value="' + esc(w.address) + '" placeholder="Street and neighbourhood" />' +
        '<label class="f mt16" for="f-site">Near a sensitive site?</label>' +
        '<select id="f-site" class="input"><option value="">No</option>' +
        ['School', 'Hospital', 'Market', 'Transit Hub'].map(function (s) { return '<option' + (w.nearSensitiveSite === s ? ' selected' : '') + '>' + s + '</option>'; }).join('') +
        '</select>' +
        (w.error ? '<div class="err">' + esc(w.error) + '</div>' : '') +
        '<div class="row between mt24"><button class="btn ghost" data-act="back">' + UI.icon('prev', 16) + 'Back</button><button class="btn primary" data-act="next">Continue' + UI.icon('next', 16) + '</button></div>' +
        '</div>' +
        '<div class="stack"><div id="nearby" data-demo="nearby">' + nearbyHtml() + '</div>' +
        '<div class="card pad20"><div class="card-title mb8">' + UI.icon('layers', 16) + 'How grouping works</div>' +
        '<p class="small muted" style="margin:0">A report joins an existing issue when it is <b>within 150 m and textually similar</b>, <b>within 60 m</b> regardless of wording, or <b>within 300 m and highly similar</b>. Distances use the Haversine formula; similarity combines Jaccard and TF-IDF cosine.</p>' + UI.aiBadge('live') +
        '</div></div></div>';
    }

    function nearbyHtml() {
      if (w.lat == null) return '<div class="card flat" style="background:var(--surface-2)"><b class="small">Nearby reports</b><p class="small muted" style="margin:6px 0 0">Drop a pin and CivicPulse will check for duplicates instantly.</p></div>';
      var draft = { title: w.title, description: w.description, category: (w.categoryOverride || CP.classify(w.title, w.description).category), lat: w.lat, lng: w.lng };
      var near = CP.nearbySimilar(draft, st.reports);
      if (!near.length) return '<div class="card flat" style="background:var(--surface-2)"><div class="row between mb8"><b class="small">Nearby reports</b>' + UI.aiBadge('live') + '</div><p class="small muted" style="margin:0">No similar open issue within 150 m. This will start a new cluster.</p></div>';
      var top = near[0];
      return '<div class="card" style="border-color:color-mix(in srgb,var(--primary) 40%,transparent)"><div class="row between mb8"><b class="small">Nearby reports</b>' + UI.aiBadge('live') + '</div>' +
        '<div class="row gap8 mb8"><b class="num" style="font-size:22px">' + near.length + '</b><span class="small">similar open issue' + (near.length === 1 ? '' : 's') + ' within 150 m</span></div>' +
        '<p class="small muted" style="margin:0">Closest match: <b>' + esc(top.report.title) + '</b> at ' + Math.round(top.distance) + ' m, similarity ' + Math.round(top.similarity * 100) + '% (category ' + esc(top.report.category) + ').</p></div>';
    }

    function step3() {
      var auto = CP.classify(w.title, w.description);
      var cat = w.categoryOverride || auto.category;
      return '<div class="split-2"><div class="card pad20">' +
        '<h2 style="font-size:20px">Review and submit</h2><p class="small muted mb16">You can override the AI category before submitting.</p>' +
        '<label class="f">Title</label><div class="card flat" style="background:var(--surface-2);padding:10px 12px">' + esc(w.title) + '</div>' +
        '<label class="f mt16">Description</label><div class="card flat" style="background:var(--surface-2);padding:10px 12px;max-height:130px;overflow:auto">' + UI.keywordHighlight(w.description, auto.matchedKeywords) + '</div>' +
        '<label class="f mt16" for="f-cat">Category (AI predicted: ' + esc(auto.category) + ' · ' + Math.round(auto.confidence * 100) + '%)</label>' +
        '<select id="f-cat" class="input">' + CP.CATEGORIES.map(function (c) { return '<option' + (cat === c ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select>' +
        '<label class="f mt16">Location</label><div class="card flat" style="background:var(--surface-2);padding:10px 12px" class="small">' + esc(w.address || 'Not set') + '<div class="xsmall muted num">' + (w.lat != null ? w.lat.toFixed(5) + ', ' + w.lng.toFixed(5) : '') + '</div></div>' +
        '<label class="f mt16">Sensitive site</label><div class="small">' + (w.nearSensitiveSite ? esc(w.nearSensitiveSite) : 'None') + '</div>' +
        (w.photoDataUrl ? '<div class="mt16"><img src="' + w.photoDataUrl + '" alt="Attached photo" style="max-height:130px;border-radius:10px" /></div>' : '') +
        (w.error ? '<div class="err">' + esc(w.error) + '</div>' : '') +
        '<div class="row between mt24"><button class="btn ghost" data-act="back">' + UI.icon('prev', 16) + 'Back</button><button class="btn primary lg" data-act="submit" data-demo="submit">' + UI.icon('zap', 17) + 'Submit report</button></div>' +
        '</div>' +
        '<div class="stack"><div class="card pad20"><div class="card-title mb8">' + UI.icon('sparkle', 16) + 'What happens on submit</div>' +
        '<ol class="small muted" style="padding-left:18px;margin:0"><li>Category and confidence are computed</li><li>Nearby similar reports are matched</li><li>The cluster priority is recomputed</li><li>You get a tracking ID</li></ol>' +
        '<div class="mt16">' + UI.aiBadge('live') + '</div></div>' +
        '<div class="card pad20"><div class="card-title mb8">' + UI.icon('note', 16) + 'Privacy</div><p class="small muted" style="margin:0">Everything stays in this browser (localStorage). Nothing is uploaded.</p></div>' +
        '</div></div>';
    }

    function paint() {
      body.innerHTML = '<div class="row between mb16"><div><h2>' + (w.step === 1 ? 'Report an Issue' : w.step === 2 ? 'Locate it on the map' : 'Review your report') + '</h2>' +
        '<p class="small muted" style="margin:4px 0 0">Step ' + w.step + ' of 3 · takes about 30 seconds</p></div><span class="chip">' + UI.aiBadge('live') + ' live analysis</span></div>' +
        stepsHtml() + (w.step === 1 ? step1() : w.step === 2 ? step2() : step3());
      bind();
      if (w.step === 2) mountPickMap();
      UI.after(body);
    }

    function setTitle(v) { w.title = v; var s = body.querySelector('#aiSugg'); if (s) s.innerHTML = suggestionHtml(); }
    function setDesc(v) {
      w.description = v;
      var cc = body.querySelector('#cc'); if (cc) cc.textContent = v.length + ' / 600';
      var s = body.querySelector('#aiSugg'); if (s) s.innerHTML = suggestionHtml();
    }

    function goStep(n) {
      if (n === 2 && (!w.title.trim() || w.description.trim().length < 15)) { w.error = 'Add a title and at least 15 characters of description before continuing.'; w.step = 1; paint(); return; }
      if (n === 3 && w.lat == null) { w.error = 'Drop a pin on the map (or use your location) so authorities know where to go.'; w.step = 2; paint(); return; }
      w.error = ''; w.step = n; paint();
      if (n === 2) CP.Demo && CP.Demo.hint && CP.Demo.hint('map');
    }

    function mountPickMap() {
      var host = body.querySelector('#pickMap');
      if (!host) return;
      var center = w.lat != null ? [w.lat, w.lng] : [CP.CITY_CENTER.lat, CP.CITY_CENTER.lng];
      var pts = st.reports.filter(function (r) { return r.clusterId; }).map(function (r) {
        var c = st.clusterById(r.clusterId);
        return { lat: r.lat, lng: r.lng, color: c ? CP.PRIORITY_COLORS[c.priorityLevel] : '#94A3B8', size: 9, label: '', title: r.title };
      });
      if (w.lat != null) pts.push({ lat: w.lat, lng: w.lng, color: 'var(--primary)', size: 24, label: '★', title: 'Your pin', pulse: true });
      var s = UI.map(host, { center: center, zoom: 14, points: pts, overlay: UI.mapLegend() });
      CP._maps.push(s);
      function place(lat, lng) {
        var a = CP.nearestAddress(lat, lng);
        w.lat = lat; w.lng = lng; w.address = a.address; w.street = a.street; w.neighborhood = a.neighborhood;
        var nb = body.querySelector('#nearby'); if (nb) nb.innerHTML = nearbyHtml();
        var af = body.querySelector('#f-addr'); if (af) af.value = a.address;
        var mark = host.querySelector('.cp-pin-marker'); if (mark) mark.remove();
        if (s.map && s.marker) s.map.removeLayer(s.marker);
        if (s.map) {
          var icon = root.L.divIcon({ className: 'cp-pin-marker', html: '<div class="pin pulse" style="width:26px;height:26px;background:var(--primary);color:var(--primary)">★</div>', iconSize: [26, 26], iconAnchor: [13, 13] });
          s.marker = root.L.marker([lat, lng], { icon: icon, draggable: true }).addTo(s.map);
          s.marker.on('dragend', function (e) { var p = e.target.getLatLng(); place(p.lat, p.lng); });
        }
      }
      if (s.map) {
        s.place = place;
        if (w.lat != null) place(w.lat, w.lng);
        s.map.on('click', function (e) { place(e.latlng.lat, e.latlng.lng); });
        setTimeout(function () { s.map.invalidateSize(); }, 150);
      } else {
        host.querySelectorAll('.pin').forEach(function (b) {
          b.addEventListener('click', function () {
            var lats = st.reports.map(function (r) { return r.lat; });
            place(CP.CITY_CENTER.lat + (Math.random() - 0.5) * 0.004, CP.CITY_CENTER.lng + (Math.random() - 0.5) * 0.004);
          });
        });
        s.place = place;
      }
    }

    function bind() {
      var t = body.querySelector('#f-title');
      if (t) t.addEventListener('input', function () { setTitle(this.value); });
      var d = body.querySelector('#f-desc');
      if (d) d.addEventListener('input', function () { setDesc(this.value); });
      var a = body.querySelector('#f-addr');
      if (a) a.addEventListener('input', function () { w.address = this.value; });
      var s = body.querySelector('#f-site');
      if (s) s.addEventListener('change', function () { w.nearSensitiveSite = this.value; });
      var c = body.querySelector('#f-cat');
      if (c) c.addEventListener('change', function () { w.categoryOverride = this.value; });

      body.querySelectorAll('[data-fill]').forEach(function (b) {
        b.addEventListener('click', function () {
          var k = b.getAttribute('data-fill');
          var ex = {
            pothole: ['Deep pothole on Lakeview Road near the bus stop', 'There is a deep pothole right at the bus stop. Two scooters skidded here this week and a child almost fell. Please fix it urgently before someone gets hurt.'],
            garbage: ['Overflowing garbage bins at the Old Market', 'The bins at the Old Market have not been cleared for days. Waste is spilling onto the street and the smell is unbearable in the afternoon heat.'],
            leak: ['Water main leaking on Station Road', 'A burst pipe is pouring water across the footpath on Station Road. Water has been wasting continuously for days and the road surface is getting soft.']
          }[k];
          setTitle(ex[0]); setDesc(ex[1]);
          var ti = body.querySelector('#f-title'); if (ti) ti.value = ex[0];
          var de = body.querySelector('#f-desc'); if (de) de.value = ex[1];
        });
      });
      body.querySelectorAll('[data-act]').forEach(function (b) {
        b.addEventListener('click', function () {
          var act = b.getAttribute('data-act');
          if (act === 'next') goStep(w.step + 1);
          else if (act === 'back') goStep(w.step - 1);
          else if (act === 'geo') useGeo();
          else if (act === 'center') { w.lat = CP.CITY_CENTER.lat; w.lng = CP.CITY_CENTER.lng; var a2 = CP.nearestAddress(w.lat, w.lng); w.address = a2.address; w.street = a2.street; w.neighborhood = a2.neighborhood; paint(); }
          else if (act === 'rmphoto') { w.photoDataUrl = null; paint(); }
          else if (act === 'submit') submit();
        });
      });
      var dz = body.querySelector('#dz'), fi = body.querySelector('#f-photo');
      if (dz && fi) {
        dz.addEventListener('click', function (e) { if (!e.target.closest('[data-act]')) fi.click(); });
        dz.addEventListener('dragover', function (e) { e.preventDefault(); dz.classList.add('over'); });
        dz.addEventListener('dragleave', function () { dz.classList.remove('over'); });
        dz.addEventListener('drop', function (e) { e.preventDefault(); dz.classList.remove('over'); if (e.dataTransfer.files[0]) readPhoto(e.dataTransfer.files[0], function (u) { w.photoDataUrl = u; paint(); }); });
        fi.addEventListener('change', function () { if (this.files[0]) readPhoto(this.files[0], function (u) { w.photoDataUrl = u; paint(); }); });
      }
    }

    function useGeo() {
      if (!navigator.geolocation) { UI.toast('Geolocation is not available in this browser. Centred on ' + CP.CITY_NAME + '.', 'warn'); return; }
      UI.toast('Requesting your location…');
      navigator.geolocation.getCurrentPosition(function (p) {
        var a = CP.nearestAddress(p.coords.latitude, p.coords.longitude);
        w.lat = p.coords.latitude; w.lng = p.coords.longitude; w.address = a.address; w.street = a.street; w.neighborhood = a.neighborhood;
        paint(); UI.toast('Location set from your device.');
      }, function () {
        w.lat = CP.CITY_CENTER.lat; w.lng = CP.CITY_CENTER.lng;
        var a = CP.nearestAddress(w.lat, w.lng); w.address = a.address; w.street = a.street; w.neighborhood = a.neighborhood;
        paint(); UI.toast('Location permission denied — centred on ' + CP.CITY_NAME + ' instead.', 'warn');
      }, { timeout: 6000 });
    }

    function readPhoto(file, cb) {
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () {
          var max = 800, ww = img.width, hh = img.height;
          if (ww > max || hh > max) { var sc = Math.min(max / ww, max / hh); ww = Math.round(ww * sc); hh = Math.round(hh * sc); }
          var cv = document.createElement('canvas'); cv.width = ww; cv.height = hh;
          cv.getContext('2d').drawImage(img, 0, 0, ww, hh);
          try { cb(cv.toDataURL('image/jpeg', 0.72)); } catch (e) { cb(fr.result); }
        };
        img.onerror = function () { cb(fr.result); };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    }

    function submit() {
      if (!w.title.trim() || w.description.trim().length < 15) { w.error = 'Title and a 15+ character description are required.'; w.step = 1; paint(); return; }
      if (w.lat == null) { w.error = 'A location is required.'; w.step = 2; paint(); return; }
      var res = st.addReport({
        title: w.title.trim(), description: w.description.trim(), lat: w.lat, lng: w.lng,
        address: w.address || CP.nearestAddress(w.lat, w.lng).address,
        street: w.street || CP.nearestAddress(w.lat, w.lng).street,
        neighborhood: w.neighborhood || CP.nearestAddress(w.lat, w.lng).neighborhood,
        photoDataUrl: w.photoDataUrl || undefined,
        nearSensitiveSite: w.nearSensitiveSite || undefined,
        categoryOverride: w.categoryOverride || undefined
      });
      ctx.lastResult = res;
      CP.analysisModal(res, function () { CP.reportSuccess(ctx, res); });
    }

    paint();
    ctx.mount.appendChild(el);

    /* expose a small API so Demo Mode can drive the wizard deterministically */
    CP.wizardApi = {
      state: w,
      setTitle: function (v) { setTitle(v); var ti = body.querySelector('#f-title'); if (ti) ti.value = v; },
      setDesc: function (v) { setDesc(v); var de = body.querySelector('#f-desc'); if (de) de.value = v; },
      quickfill: function (k) { var b = body.querySelector('[data-fill="' + k + '"]'); if (b) b.click(); },
      goStep: goStep,
      place: function (lat, lng) { var host = body.querySelector('#pickMap'); if (host) { var s = CP._maps[CP._maps.length - 1]; if (s && s.place) s.place(lat, lng); } },
      submit: submit,
      fillFrom: function (p) {
        w.title = p.title; w.description = p.description; w.lat = p.lat; w.lng = p.lng;
        w.address = p.address; w.street = p.street; w.neighborhood = p.neighborhood; w.nearSensitiveSite = p.nearSensitiveSite || '';
        var ti = body.querySelector('#f-title'); if (ti) ti.value = p.title;
        var de = body.querySelector('#f-desc'); if (de) de.value = p.description;
        setTitle(p.title); setDesc(p.description);
      }
    };
    return el;
  };

  /* ================= MY REPORTS ================= */
  P.myReports = function (ctx) {
    var st = ctx.store;
    var filter = ctx.myFilter || (ctx.myFilter = 'all');
    var mine = st.reports.filter(function (r) { return r.isMine; }).slice().sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
    var shown = filter === 'all' ? mine : mine.filter(function (r) { return st.clusterById(r.clusterId).status === filter; });

    var el = H('<div class="page"><div class="wrap"></div></div>');
    var body = el.querySelector('.wrap');

    function card(r) {
      var c = st.clusterById(r.clusterId);
      var isNew = ctx.newReportId === r.id;
      var col = CP.CATEGORY_COLORS[r.category];
      return '<div class="card hoverable ' + (isNew ? 'flash' : '') + '" data-rep="' + r.id + '" style="' + (isNew ? 'border-color:var(--primary)' : '') + '">' +
        '<div class="row gap12 between wrap">' +
        '<div class="row gap12 grow">' +
        '<span style="width:40px;height:40px;border-radius:11px;background:' + col + '22;color:' + col + ';display:grid;place-items:center;flex:none">' + UI.icon('mapPin', 18) + '</span>' +
        '<div class="grow" style="min-width:0"><b class="truncate" style="display:block">' + esc(r.title) + '</b>' +
        '<div class="row wrap gap8 xsmall muted mt8">' + UI.categoryChip(r.category) + UI.statusPill(c.status) + '<span>' + CP.relTime(r.createdAt) + '</span><span>·</span><span class="num">' + r.id + '</span>' +
        (c.reportIds.length > 1 ? '<span>·</span><span>Part of a cluster with ' + (c.reportIds.length - 1) + ' other' + (c.reportIds.length - 1 === 1 ? '' : 's') + '</span>' : '') + '</div>' +
        '</div></div>' +
        '<div class="col gap8" style="align-items:flex-end">' + UI.priorityBadge(c.priorityLevel) + '<button class="btn sm ghost" data-exp="' + r.id + '">' + UI.icon('next', 14) + 'Timeline</button></div>' +
        '</div>' +
        '<div class="mt16">' + UI.statusStepper(c.status) + '</div>' +
        '<div class="mt16" data-tl="' + r.id + '" style="display:none">' +
        '<div class="tl">' + (c.statusHistory || []).map(function (h, i) {
          var now = i === (c.statusHistory.length - 1);
          return '<div class="it ' + (now ? 'now' : 'done') + '"><b class="small">' + esc(h.status) + '</b><div class="xsmall muted" title="' + esc(CP.fmtDateTime(h.at)) + '">' + CP.relTime(h.at) + ' · ' + esc(CP.fmtDateTime(h.at)) + '</div>' + (h.note ? '<div class="small muted">' + esc(h.note) + '</div>' : '') + '</div>';
        }).join('') + '</div>' +
        '<div class="row gap8 mt8"><a class="btn sm" href="#/authority/issues/' + c.id + '">Open cluster ' + c.id + '</a><span class="small muted">Assigned to ' + esc(c.assignedDepartment) + (c.assignedTo ? ' · ' + esc(c.assignedTo) : '') + '</span></div>' +
        '</div></div>';
    }

    function paint() {
      body.innerHTML =
        '<div class="row between wrap gap12 mb16"><div><h2>My Reports</h2><p class="small muted" style="margin:4px 0 0">' + mine.length + ' report' + (mine.length === 1 ? '' : 's') + ' submitted from this browser. Track each one end to end.</p></div>' +
        '<a class="btn primary" href="#/report">' + UI.icon('plus', 16) + 'Report another</a></div>' +
        '<div class="row wrap gap8 mb16"><span class="xsmall muted">Filter:</span>' +

      if (anyCat) cs = cs.filter(function (c) { return f.cats[c.category]; });
      if (f.status !== 'all') cs = cs.filter(function (c) { return c.status === f.status; });
      if (f.q) { var q = f.q.toLowerCase(); cs = cs.filter(function (c) { return (c.title + ' ' + c.neighborhood + ' ' + c.id).toLowerCase().indexOf(q) !== -1; }); }
      if (f.sort === 'priority') cs.sort(function (a, b) { return b.priorityScore - a.priorityScore; });
      else if (f.sort === 'new') cs.sort(function (a, b) { return new Date(b.lastReportedAt) - new Date(a.lastReportedAt); });
      else if (f.sort === 'reports') cs.sort(function (a, b) { return b.reportIds.length - a.reportIds.length; });
      else cs.sort(function (a, b) { return new Date(a.firstReportedAt) - new Date(b.firstReportedAt); });
      return cs;
    }

    function kpis() {
      var open = st.clusters.filter(function (c) { return c.status !== 'Resolved'; });
      var crit = st.clusters.filter(function (c) { return c.priorityLevel === 'Critical' && c.status !== 'Resolved'; }).length;
      var today = st.reports.filter(function (r) { return (Date.now() - new Date(r.createdAt)) < 86400000; }).length;
      var rate = st.clusters.length ? Math.round((st.clusters.filter(function (c) { return c.status === 'Resolved'; }).length / st.clusters.length) * 100) : 0;
      return '<div class="grid g5">' +
        UI.statCard({ label: 'Open clusters', value: open.length, sub: st.reports.length + ' reports grouped' }) +
        UI.statCard({ label: 'Critical issues', value: crit, color: 'var(--critical)', sub: '<span class="row" style="gap:6px"><i class="dot" style="width:7px;height:7px;border-radius:50%;background:var(--critical);display:inline-block"></i>needs action now</span>' }) +
        UI.statCard({ label: 'Avg. resolution time', value: CP.avgResolution(st.clusters), decimals: 1, suffix: ' d', sub: 'from first report to closed' }) +
        UI.statCard({ label: 'Reports today', value: today, sub: 'last 24 hours' }) +
        UI.statCard({ label: 'Resolution rate', value: rate, suffix: '%', sub: st.clusters.filter(function (c) { return c.status === 'Resolved'; }).length + ' of ' + st.clusters.length + ' clusters closed' }) +
        '</div>';
    }

    function qcard(c, rank) {
      var flash = ctx.flashCluster === c.id;
      var bump = ctx.bumpCluster === c.id;
      return '<div class="card hoverable qcard ' + (flash ? 'flash' : '') + '" data-cl="' + c.id + '" data-hover="' + c.id + '" tabindex="0" role="button" aria-label="' + esc(c.title) + ', priority ' + c.priorityScore + '">' +
        '<span class="rank">#' + rank + '</span>' +
        '<div class="row gap12" style="padding-left:26px">' +
        UI.priorityRing(c.priorityScore, c.priorityLevel, 52) +
        '<div class="grow" style="min-width:0">' +
        '<div class="row gap8 between wrap"><b class="truncate grow">' + esc(c.title) + '</b>' + UI.priorityBadge(c.priorityLevel) + '</div>' +
        '<div class="row wrap gap8 xsmall muted mt8">' + UI.categoryChip(c.category) + UI.statusPill(c.status) +
        '<span class="' + (bump ? 'bump' : '') + '" style="display:inline-block">' + c.reportIds.length + ' reports</span><span>·</span><span>' + esc(c.neighborhood) + '</span>' +
        '<span>·</span><span>' + Math.floor((Date.now() - new Date(c.firstReportedAt)) / 86400000) + ' d open</span></div>' +
        '<div class="row gap8 mt8" style="align-items:center"><span class="xsmall muted" style="width:104px;flex:none">Escalation risk</span>' +
        '<span class="bar grow" style="height:6px"><i style="width:' + Math.round(c.escalationRisk * 100) + '%;background:' + (c.escalationRisk > 0.66 ? 'var(--critical)' : c.escalationRisk > 0.4 ? 'var(--high)' : 'var(--low)') + '"></i></span>' +
        '<span class="xsmall num muted">' + Math.round(c.escalationRisk * 100) + '%</span>' + UI.aiBadge('sim') + '</div>' +
        '</div></div>' +
        '<div class="row between mt16" style="align-items:center"><span class="row gap8">' + UI.aiBadge('live', 'Score: Live logic') + '</span>' +
        '<span class="qactions"><button class="btn sm" data-assign="' + c.id + '">' + UI.icon('users', 13) + 'Assign</button>' +
        '<button class="btn sm" data-progress="' + c.id + '">' + UI.icon('play', 13) + 'Mark in progress</button></span></div>' +
        '</div>';
    }

    function charts() {
      var an = CP.computeAnalytics(st.reports, st.clusters, { rangeDays: 14, category: 'all' });
      var donut = CP.CATEGORIES.map(function (c) { return { label: c, value: an.byCategory[c], color: CP.CATEGORY_COLORS[c] }; });
      return '<div class="grid g2">' +
        '<div class="card pad20"><div class="card-head"><div class="card-title">' + UI.icon('layers', 16) + 'Category distribution</div><a class="small" href="#/authority/analytics">View full analytics →</a></div>' +
        '<div class="row gap16 wrap">' + UI.donut(donut, { centerLabel: 'reports' }) + '<div class="grow">' + UI.legend(donut) + '</div></div></div>' +
        '<div class="card pad20"><div class="card-head"><div class="card-title">' + UI.icon('trend', 16) + 'Reports, last 14 days</div><a class="small" href="#/authority/analytics">View full analytics →</a></div>' +
        UI.areaChart(an.days) + '</div></div>';
    }

    function paint() {
      var rows = filtered();
      var open = st.clusters.filter(function (c) { return c.status !== 'Resolved'; });
      body.innerHTML =
        '<div class="row between wrap gap12 mb16"><div><h2>Authority Command Dashboard</h2><p class="small muted" style="margin:4px 0 0">' + esc(CP.CITY_NAME) + ' · one ranked queue instead of ' + st.reports.length + ' separate complaints.</p></div>' +
        '<div class="row gap8"><button class="btn" data-act="reset" data-demo="reset">' + UI.icon('restart', 15) + 'Reset demo data</button></div></div>' +
        '<div class="seg mb16" data-tabs style="display:none">' +
        ['list', 'map', 'analytics'].map(function (t) { return '<button class="' + (f.tab === t ? 'on' : '') + '" data-tab="' + t + '">' + (t === 'list' ? 'List' : t === 'map' ? 'Map' : 'Analytics') + '</button>'; }).join('') + '</div>' +
        '<div class="dash-tabs ' + (f.tab === 'list' ? 't-list' : f.tab === 'map' ? 't-map' : 't-analytics') + '" data-dash>' +
        '<div class="mb16" data-pane="kpi">' + kpis() + '</div>' +
        '<div class="split-40 mb16">' +
        '<div data-pane="list"><div class="card pad20">' +
        '<div class="card-head"><div class="card-title">' + UI.icon('alert', 16) + 'Priority queue</div><span class="xsmall muted">' + rows.length + ' of ' + st.clusters.length + ' clusters</span></div>' +
        '<div class="row wrap gap8 mb8">' + CP.PRIORITY_LEVELS.map(function (l) {
          return '<button class="chip btn-like ' + (f.levels[l] ? 'active' : '') + '" data-lv="' + l + '"><i class="dot" style="background:' + CP.PRIORITY_COLORS[l] + '"></i>' + l + '</button>';
        }).join('') + '</div>' +
        '<div class="row wrap gap8 mb8" style="gap:4px">' + CP.CATEGORIES.map(function (c) {
          return '<button class="chip btn-like ' + (f.cats[c] ? 'active' : '') + '" data-cat="' + c + '" style="font-size:11.5px">' + esc(c) + '</button>';
        }).join('') + '</div>' +
        '<div class="row gap8 mb16 wrap"><select class="input" data-status style="max-width:150px"><option value="all">All statuses</option>' +
        CP.STATUSES.map(function (s) { return '<option' + (f.status === s ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select>' +
        '<input class="input grow" data-q placeholder="Search queue…" value="' + esc(f.q) + '" style="min-width:120px" />' +
        '<select class="input" data-sort style="max-width:170px"><option value="priority"' + (f.sort === 'priority' ? ' selected' : '') + '>Priority</option>' +
        '<option value="new"' + (f.sort === 'new' ? ' selected' : '') + '>Newest</option><option value="reports"' + (f.sort === 'reports' ? ' selected' : '') + '>Most reports</option>' +
        '<option value="oldest"' + (f.sort === 'oldest' ? ' selected' : '') + '>Oldest unresolved</option></select></div>' +
        '<div class="stack" data-queue>' + (rows.length ? rows.map(qcard).join('') : UI.emptyState('No clusters match', 'Clear a filter to see the full queue again.', 'Clear filters', 'clearq')) + '</div>' +
        '</div></div>' +
        '<div data-pane="map"><div class="card pad20"><div class="card-head"><div class="card-title">' + UI.icon('mapPin', 16) + 'Live map</div>' +
        '<div class="row gap8"><div class="seg">' + ['clusters', 'reports', 'heatmap'].map(function (l) { return '<button class="' + (layer === l ? 'on' : '') + '" data-layer="' + l + '">' + (l === 'clusters' ? 'Clusters' : l === 'reports' ? 'Reports' : 'Heatmap') + '</button>'; }).join('') + '</div>' +
        '<button class="btn sm" data-act="fit">Fit to all</button></div></div>' +
        '<div id="dashMap" style="height:640px;position:relative"></div>' +
        '<div class="row wrap gap8 mt16 xsmall muted">' + CP.PRIORITY_LEVELS.map(function (l) { return '<span class="row" style="gap:5px"><i style="width:9px;height:9px;border-radius:50%;background:' + CP.PRIORITY_COLORS[l] + ';display:inline-block"></i>' + l + '</span>'; }).join('') +
        '<span>· circle size = report count</span></div></div></div>' +
        '</div>' +
        '<div data-pane="analytics">' + charts() + '</div>' +
        '</div>';

      var style = el.querySelector('#dashStyle');
      if (!style) {
        style = document.createElement('style'); style.id = 'dashStyle';
        style.textContent = '@media(max-width:900px){.dash-tabs[data-dash] [data-pane]{display:none}.dash-tabs.t-list [data-pane="kpi"],.dash-tabs.t-list [data-pane="list"],.dash-tabs.t-map [data-pane="kpi"],.dash-tabs.t-map [data-pane="map"],.dash-tabs.t-analytics [data-pane="analytics"]{display:block}.dash [data-tabs]{display:inline-flex !important}}';
        el.appendChild(style);
      }

      body.querySelectorAll('[data-lv]').forEach(function (b) { b.addEventListener('click', function () { var l = b.getAttribute('data-lv'); f.levels[l] = !f.levels[l]; paint(); }); });
      body.querySelectorAll('[data-cat]').forEach(function (b) { b.addEventListener('click', function () { var c = b.getAttribute('data-cat'); f.cats[c] = !f.cats[c]; paint(); }); });
      body.querySelector('[data-status]').addEventListener('change', function () { f.status = this.value; paint(); });
      body.querySelector('[data-sort]').addEventListener('change', function () { f.sort = this.value; paint(); });
      var q = body.querySelector('[data-q]');
      q.addEventListener('input', function () { f.q = this.value; var p = this.selectionStart; paint(); var n = body.querySelector('[data-q]'); n.focus(); n.setSelectionRange(p, p); });
      var clr = body.querySelector('[data-action="clearq"]'); if (clr) clr.addEventListener('click', function () { f.levels = {}; f.cats = {}; f.status = 'all'; f.q = ''; paint(); });
      body.querySelectorAll('[data-tab]').forEach(function (b) { b.addEventListener('click', function () { f.tab = b.getAttribute('data-tab'); paint(); }); });
      body.querySelectorAll('[data-layer]').forEach(function (b) { b.addEventListener('click', function () { layer = b.getAttribute('data-layer'); ctx.dashLayer = layer; paint(); }); });
      var fit = body.querySelector('[data-act="fit"]'); if (fit) fit.addEventListener('click', function () { if (mapState && mapState.fitAll) mapState.fitAll(); });
      var rst = body.querySelector('[data-act="reset"]'); if (rst) rst.addEventListener('click', function () { CP.resetWithConfirm(ctx); });

      body.querySelectorAll('[data-cl]').forEach(function (card) {
        var id = card.getAttribute('data-cl');
        card.addEventListener('click', function (e) {
          if (e.target.closest('[data-assign]') || e.target.closest('[data-progress]')) return;
          location.hash = '#/authority/issues/' + id;
        });
        card.addEventListener('keydown', function (e) { if (e.key === 'Enter') location.hash = '#/authority/issues/' + id; });
        card.addEventListener('mouseenter', function () { hoverId = id; if (mapState && mapState.focus) mapState.focus(id, false); });
        card.addEventListener('mouseleave', function () { hoverId = null; });
      });
      body.querySelectorAll('[data-assign]').forEach(function (b) {
        b.addEventListener('click', function (e) { e.stopPropagation(); CP.assignPopover(b, b.getAttribute('data-assign'), ctx); });
      });
      body.querySelectorAll('[data-progress]').forEach(function (b) {
        b.addEventListener('click', function (e) {
          e.stopPropagation();
          var id = b.getAttribute('data-progress');
          st.setClusterStatus(id, 'In Progress', 'Marked in progress from the priority queue.');
          UI.toast(id + ' marked In Progress.', 'ok');
        });
      });
      UI.after(body);
      mountDashMap(rows);
      ctx.flashCluster = null; ctx.bumpCluster = null;
    }

    function mountDashMap(rows) {
      var host = body.querySelector('#dashMap');
      if (!host) return;
      var cs = rows;
      var pts = [];
      if (layer === 'reports') {
        cs.forEach(function (c) {
          c.reportIds.forEach(function (rid) {
            var r = st.reportById(rid); if (!r) return;
            pts.push({ lat: r.lat, lng: r.lng, color: CP.PRIORITY_COLORS[c.priorityLevel], size: 13, label: '', title: r.title, pulse: c.priorityLevel === 'Critical' });
          });
        });
      } else {
        cs.forEach(function (c) {
          pts.push({ lat: c.centroid.lat, lng: c.centroid.lng, color: CP.PRIORITY_COLORS[c.priorityLevel], size: 15 + Math.min(22, c.reportIds.length * 2), label: String(c.reportIds.length), title: c.title, pulse: c.priorityLevel === 'Critical', onClick: function () { location.hash = '#/authority/issues/' + c.id; } });
        });
      }
      mapState = UI.map(host, { center: [CP.CITY_CENTER.lat, CP.CITY_CENTER.lng], zoom: 13, points: pts, overlay: UI.mapLegend() });
      CP._maps.push(mapState);
      var markers = {};
      if (mapState.map) {
        if (layer === 'heatmap') {
          cs.forEach(function (c) {
            var rad = 120 + Math.min(260, c.reportIds.length * 34);
            root.L.circle([c.centroid.lat, c.centroid.lng], { radius: rad, stroke: false, fillColor: CP.PRIORITY_COLORS[c.priorityLevel], fillOpacity: .22 }).addTo(mapState.map);
            root.L.circle([c.centroid.lat, c.centroid.lng], { radius: rad * 0.6, stroke: false, fillColor: CP.PRIORITY_COLORS[c.priorityLevel], fillOpacity: .3 }).addTo(mapState.map);
          });
        }
        if (layer !== 'reports') {
          cs.forEach(function (c) {
            var col = CP.PRIORITY_COLORS[c.priorityLevel], size = 15 + Math.min(22, c.reportIds.length * 2);
            if (layer === 'clusters') root.L.circle([c.centroid.lat, c.centroid.lng], { radius: c.radiusMeters, color: col, weight: 1, fillColor: col, fillOpacity: .07 }).addTo(mapState.map);
            var icon = root.L.divIcon({ className: '', html: '<div class="pin' + (c.priorityLevel === 'Critical' ? ' pulse' : '') + '" style="width:' + size + 'px;height:' + size + 'px;background:' + col + ';color:' + col + '">' + c.reportIds.length + '</div>', iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
            var m = root.L.marker([c.centroid.lat, c.centroid.lng], { icon: icon }).addTo(mapState.map);
            m.bindPopup('<b>' + esc(c.title) + '</b><br>' + c.reportIds.length + ' reports · score ' + c.priorityScore + ' (' + c.priorityLevel + ')<br><a href="#/authority/issues/' + c.id + '">Open details →</a>');
            m.on('click', function () { var card = body.querySelector('[data-cl="' + c.id + '"]'); if (card) { card.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); card.style.outline = '2px solid var(--primary)'; setTimeout(function () { card.style.outline = ''; }, 1400); } });
            markers[c.id] = m;
          });
        } else {
          cs.forEach(function (c) {
            c.reportIds.forEach(function (rid) {
              var r = st.reportById(rid); if (!r) return;
              var col = CP.PRIORITY_COLORS[c.priorityLevel];
              var icon = root.L.divIcon({ className: '', html: '<div class="pin" style="width:12px;height:12px;background:' + col + ';color:' + col + '"></div>', iconSize: [12, 12], iconAnchor: [6, 6] });
              root.L.marker([r.lat, r.lng], { icon: icon }).addTo(mapState.map).bindPopup('<b>' + esc(r.title) + '</b><br>' + esc(r.category) + ' · ' + esc(r.neighborhood) + '<br><a href="#/authority/issues/' + c.id + '">Open cluster →</a>');
            });
          });
        }
        mapState.focus = function (id, fly) {
          var c = st.clusterById(id); if (!c) return;
          if (fly !== false && mapState.map) mapState.map.flyTo([c.centroid.lat, c.centroid.lng], 16, { duration: 0.8 });
          if (markers[id]) markers[id].openPopup();
        };
        mapState.fitAll = function () {
          if (!cs.length) return;
          var lats = cs.map(function (c) { return c.centroid.lat; }), lngs = cs.map(function (c) { return c.centroid.lng; });
          mapState.map.fitBounds([[Math.min.apply(null, lats), Math.min.apply(null, lngs)], [Math.max.apply(null, lats), Math.max.apply(null, lngs)]], { padding: [40, 40] });
        };
        setTimeout(function () { mapState.map.invalidateSize(); if (ctx.demoFocus) mapState.focus(ctx.demoFocus); }, 180);
      } else {
        mapState.focus = function () { };
        mapState.fitAll = function () { };
      }
    }

    paint();
    ctx.mount.appendChild(el);
    CP.dashApi = { repaint: paint, focus: function (id) { if (mapState && mapState.focus) mapState.focus(id); }, tab: function (t) { f.tab = t; paint(); } };
    return el;
  };

  /* ================= assign popover ================= */
  CP.assignPopover = function (anchor, clusterId, ctx) {
    var st = ctx.store, c = st.clusterById(clusterId);
    var old = document.querySelector('.pop'); if (old) old.remove();
    var pop = document.createElement('div');
    pop.className = 'pop';
    var rect = anchor.getBoundingClientRect();
    pop.style.position = 'fixed';
    pop.style.top = Math.min(window.innerHeight - 240, rect.bottom + 8) + 'px';
    pop.style.left = Math.max(12, Math.min(window.innerWidth - 270, rect.left - 120)) + 'px';
    pop.innerHTML = '<b class="small">Assign ' + esc(c.id) + '</b>' +
      '<label class="f mt8">Department</label><select class="input" data-dept>' +
      Object.keys(CP.DEPARTMENT).map(function (k) { return CP.DEPARTMENT[k]; }).filter(function (v, i, a) { return a.indexOf(v) === i; })
        .map(function (d) { return '<option' + (d === c.assignedDepartment ? ' selected' : '') + '>' + d + '</option>'; }).join('') + '</select>' +
      '<label class="f mt8">Officer</label><select class="input" data-off>' + CP.OFFICERS.map(function (o) { return '<option' + (o === c.assignedTo ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select>' +
      '<div class="row gap8 mt16"><button class="btn sm primary grow" data-go>Assign</button><button class="btn sm" data-cancel>Cancel</button></div>';
    document.body.appendChild(pop);
    function close() { pop.remove(); document.removeEventListener('click', outside, true); }
    function outside(e) { if (!pop.contains(e.target) && e.target !== anchor) close(); }
    setTimeout(function () { document.addEventListener('click', outside, true); }, 10);
    pop.querySelector('[data-cancel]').addEventListener('click', close);
    pop.querySelector('[data-go]').addEventListener('click', function () {
      st.assignCluster(clusterId, pop.querySelector('[data-dept]').value, pop.querySelector('[data-off]').value);
      UI.toast(clusterId + ' assigned to ' + pop.querySelector('[data-off]').value + ' · ' + pop.querySelector('[data-dept]').value + '.', 'ok');
      close();
    });
  };

  /* ================= CLUSTER DETAIL ================= */
  P.clusterDetail = function (ctx, id) {
    var st = ctx.store;
    var c = st.clusterById(id);
    var el = H('<div class="page"><div class="wrap"></div></div>');
    var body = el.querySelector('.wrap');
    if (!c) {
      body.appendChild(H(UI.emptyState('Cluster not found', 'That cluster id does not exist. It may have been removed by a data reset.', 'Back to dashboard', 'back')));
      body.querySelector('[data-action="back"]').addEventListener('click', function () { location.hash = '#/authority'; });
      ctx.mount.appendChild(el); return el;
    }
    var reports = c.reportIds.map(function (r) { return st.reportById(r); }).filter(Boolean);
    var near = reports.filter(function (r) { return r.nearSensitiveSite; })[0];

    body.innerHTML =
      '<div class="row gap8 small mb16"><a href="#/authority">' + UI.icon('arrowLeft', 14) + ' Priority queue</a><span class="muted">/</span><span class="muted">' + esc(c.id) + '</span></div>' +
      '<div class="card pad20 mb16"><div class="row between wrap gap16">' +
      '<div class="grow"><div class="row wrap gap8 mb8">' + UI.categoryChip(c.category) + UI.statusPill(c.status) + UI.priorityBadge(c.priorityLevel) +
      (near ? '<span class="chip">' + UI.icon('alert', 12) + ' near ' + esc(near.nearSensitiveSite) + '</span>' : '') + '</div>' +
      '<h2>' + esc(c.title) + '</h2>' +
      '<p class="small muted" style="margin:6px 0 0">' + c.reportIds.length + ' reports · first ' + CP.fmtDate(c.firstReportedAt) + ' · last ' + CP.relTime(c.lastReportedAt) + ' · radius ' + c.radiusMeters + ' m · ' + esc(c.neighborhood) + '</p></div>' +
      '<div class="row gap16">' + UI.priorityRing(c.priorityScore, c.priorityLevel, 84) + '<div class="col gap8" style="justify-content:center">' + UI.priorityBadge(c.priorityLevel) + '<span class="xsmall muted">Priority score</span>' + UI.aiBadge('live') + '</div></div>' +
      '</div></div>' +

      '<div class="split-3">' +
      /* LEFT */
      '<div class="stack">' +
      '<div class="card pad20"><div class="card-head"><div class="card-title">' + UI.icon('sparkle', 16) + 'AI Summary</div>' + UI.aiBadge('sim', 'Template summary') + '</div>' +
      '<p class="small" data-summary style="margin:0"></p></div>' +

      '<div class="card pad20"><div class="card-head"><div class="card-title">' + UI.icon('info', 16) + 'Why this priority?</div>' + UI.aiBadge('live') + '</div>' +
      UI.contributionBar(c.priorityBreakdown) +
      '<div class="row wrap gap8 xsmall muted mt8" style="gap:10px">' + c.priorityBreakdown.map(function (f, i) {
        var cols = ['#4F46E5', '#14B8A6', '#F97316', '#8B5CF6', '#DC2626'];
        return '<span class="row" style="gap:5px"><i style="width:9px;height:9px;border-radius:3px;background:' + cols[i % 5] + ';display:inline-block"></i>' + esc(f.factor) + ' <b class="num">' + f.contribution.toFixed(1) + '</b></span>';
      }).join('') + '</div>' +
      '<div class="mt16">' + UI.factorTable(c.priorityBreakdown, c.priorityScore) + '</div></div>' +

      '<div class="card pad20"><div class="card-head"><div class="card-title">' + UI.icon('trend', 16) + 'Escalation risk</div>' + UI.aiBadge('sim') + '</div>' +
      UI.gauge(c.escalationRisk) +
